<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Title -->
  <title>My Cucu Collection | Fashion, Accessories & Online Shopping Store</title>

  <!-- SEO Description -->
  <meta name="description" content="My Cucu Collection is an online shopping store offering fashion wear, watches, toys, kitchen accessories, beauty products, lifestyle essentials and trending items with stylish collections and affordable prices in Pakistan.">

  <!-- Keywords -->
  <meta name="keywords" content="My Cucu Collection, online shopping Pakistan, fashion store, watches, toys, kitchen accessories, beauty products, lifestyle products, women fashion, online store Pakistan">

  <!-- Author -->
  <meta name="author" content="My Cucu Collection">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Canonical -->
  <link rel="canonical" href="https://my.cucucollection.shop/">

  <!-- Open Graph SEO -->
  <meta property="og:title" content="My Cucu Collection | Online Shopping Store">
  <meta property="og:description" content="Explore fashion, watches, toys, kitchen accessories and trending products at My Cucu Collection Pakistan.">
  <meta property="og:image" content="https://my.cucucollection.shop/Store%20icons/Cucu.png">
  <meta property="og:url" content="https://my.cucucollection.shop/">
  <meta property="og:type" content="website">

  <!-- Twitter SEO -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Cucu Collection">
  <meta name="twitter:description" content="Online shopping store for fashion, accessories and lifestyle products in Pakistan.">
  <meta name="twitter:image" content="https://my.cucucollection.shop/Store%20icons/Cucu.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Store icons/Cucu.png">

  <!-- Theme Color -->
  <meta name="theme-color" content="#ffffff">

  <!-- CSS -->
  <link rel="stylesheet" href="Store.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Structured Data SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "My Cucu Collection",
    "url": "https://my.cucucollection.shop/",
    "logo": "https://my.cucucollection.shop/Store%20icons/Cucu.png",
    "description": "Online shopping store offering fashion wear, accessories, watches, toys, kitchen items and lifestyle products in Pakistan.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "PK"
    }
  }
  </script>
</head>
<body>

  <header>
    <h1 id="sellerName"></h1>
    <div class="logo1">
      <img id="sellerLogo" src="Store icons/Cucu.png" width="50" height="50" alt="Seller Logo">
    </div>
  </header>
  
  <!-- Search -->
  <div class="search-wrap">
    <input type="text" id="searchInput" class="search" placeholder="🔍 Search...">
    <button onclick="searchItems()" class="btn">Search</button>
  </div>

  <!-- Recent Search Panel -->
  <div id="searchPanel" class="search-panel">
    <div class="panel-header">
      <p class="recent-title">Recent Searches</p>
      <button id="clearHistoryBtn" class="clear-btn">Clear</button>
    </div>
    <ul id="recentSearches"></ul>

    <div class="suggestions">
      <span onclick="fillAndSearch('Summer')">Summer Collection 🔥</span>
      <span onclick="fillAndSearch('Lawn')">Lawn Dresses 🔥</span>
      <span onclick="fillAndSearch('Occasion')">Occasion Collection 🔥</span>
      <span onclick="fillAndSearch('Khaddar')">Khaddar Dresses 🔥</span>
    </div>
  </div>

  <div style="margin-bottom:74px;"></div>

  <!-- Swiper Slider (Ads) -->
  <div class="swiper mySwiper" id="adSlider">
    <div class="swiper-wrapper" id="swiperWrapper">
      <div class="swiper-slide" id="ad1"><img src="" alt="Ad 1" loading="lazy"></div>
      <div class="swiper-slide" id="ad2"><img src="" alt="Ad 2" loading="lazy"></div>
      <div class="swiper-slide" id="ad3"><img src="" alt="Ad 3" loading="lazy"></div>
      <div class="swiper-slide" id="ad4"><img src="" alt="Ad 4" loading="lazy"></div>
      <div class="swiper-slide" id="ad5"><img src="" alt="Ad 5" loading="lazy"></div>
      <div class="swiper-slide" id="ad6"><img src="" alt="Ad 6" loading="lazy"></div>
      <div class="swiper-slide" id="ad7"><img src="" alt="Ad 7" loading="lazy"></div>
      <div class="swiper-slide" id="ad8"><img src="" alt="Ad 8" loading="lazy"></div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- 🔹 Flash Sale Section -->
  <div class="flash-sale-section" id="flashSaleBox" style="display:none;">
    <div class="flash-sale-heading">🔥 Flash Sale</div>
    <div id="flashSaleContainer" class="flash-sale-grid"></div>
  </div>

  <!-- Skeleton Loading -->
  <div id="skeletonContainer" class="skeleton-container">
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-price"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-price"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-price"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-price"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-price"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-price"></div></div>
  </div>

  <div id="itemContainer" class="container" style="display:none;"></div>
  
  <!-- Bottom Navigation Bar -->
  <div class="bar">
    <a href="index.html" id="homeLink" class="active"><img src="Store icons/Home.png" width="25" height="25"><br>Home</a>
    <a href="Categories Stores.html" id="categoriesLink"><img src="Store icons/Categories.png" width="25" height="25"><br>Categories</a>
    <a href="Cart Stores.html" id="cartLink"><img src="Store icons/Cart.png" width="25" height="25"><br>Cart</a>
    <a href="Profile Stores.html" id="profileLink"><img src="Store icons/Profile.png" width="25" height="25"><br>Profile</a>
  </div>
  
  <script src="Store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
</body>
</html>
